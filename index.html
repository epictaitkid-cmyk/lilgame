<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Passing Through Town: Bloomington Edition v2</title>
    <style>
        /* Using a slightly chunky, retro font */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'VT323', monospace;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Bloomington Sky: Fade from Indiana pale blue to a warmer horizon */
            background: linear-gradient(to bottom, #87CEEB 0%, #C4E0E5 70%, #F3E5AB 100%);
        }

        canvas {
            display: block;
            /* Subtle shadow to make the game world pop */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .score-board {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 50px;
            color: white;
            /* Crimson text shadow for definition */
            text-shadow: 3px 3px 0px #7D110C;
        }

        /* Styles for floating coin text (+5) */
        .floating-text {
            position: absolute;
            font-size: 30px;
            color: #FFD700; /* Gold */
            text-shadow: 2px 2px 0px #7D110C;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(125, 17, 12, 0.8); /* Crimson tinted overlay */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
            backdrop-filter: blur(2px);
        }

        h1 {
            color: #F3E5AB; /* Cream */
            text-shadow: 4px 4px 0px #4a0a07;
            text-align: center;
            font-size: 60px;
            margin-bottom: 10px;
            line-height: 0.9;
        }

        p {
            font-size: 24px;
            color: #F3E5AB;
            text-align: center;
            max-width: 600px;
        }

        button {
            margin-top: 30px;
            padding: 10px 40px;
            font-family: 'VT323', monospace;
            font-size: 30px;
            background-color: #F3E5AB; /* Cream background */
            color: #7D110C; /* Crimson Text */
            border: 4px solid #7D110C;
            cursor: pointer;
            box-shadow: 0 8px 0 #4a0a07;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #4a0a07;
        }

        .hidden { display: none !important; }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #7D110C;
            font-size: 20px;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" id="ui-container">
        <div class="score-board" id="score-display">0</div>
    </div>

    <div id="start-screen">
        <h1>PASSING THROUGH<br>TOWN</h1>
        <p>Bloomington Edition</p>
        <p style="font-size: 20px; margin-top: 20px; opacity: 0.8">Collect coins & avoid the Campus Bus!</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="font-size: 80px">OH NO!</h1>
        <p id="final-score-text">Score: 0</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <div class="controls-hint">Tap screen or use Arrow Keys</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiContainer = document.getElementById('ui-container');
    
    // Game Constants
    const TILE_SIZE = 42; // Slightly larger tiles
    const COLS = 13; 
    const ROWS_VISIBLE = 17;
    
    // Enhanced Palette
    const COLORS = {
        crimson: '#990000', // Slightly deeper IU crimson
        cream: '#F3E5AB',
        asphalt: '#3a3a3a',
        grass: '#4A6B3E', 
        grassLight: '#5C8A4E',
        water: '#4FC3F7',
        waterDeep: '#0288D1',
        limestone: '#D8D8D6',
        limestoneDark: '#A0A0A0',
        treeTrunk: '#5D4037',
        gold: '#FFD700',
        leaves: ['#E65100', '#B71C1C', '#FBC02D', '#FF8F00'] // More varied autumn leaves
    };

    let width, height;
    let gameActive = false;
    let score = 0;
    let maxDistance = 0; // Track furthest distance reached
    let lanes = [];
    let player;
    let cameraY = 0;
    let gameSpeed = 0.002;
    let frame = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------------------------------------------------------
    // Rendering Helpers (Cleaned Up)
    // ---------------------------------------------------------
    
    function shadeColor(color, percent) {
        // Ensure 6 digit hex
        if (color.length === 4) {
             color = '#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
        }
        let R = parseInt(color.substring(1,3),16);
        let G = parseInt(color.substring(3,5),16);
        let B = parseInt(color.substring(5,7),16);

        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);

        R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255; 
        R = (R>0)?R:0; G = (G>0)?G:0; B = (B>0)?B:0;

        const RR = R.toString(16).padStart(2, '0');
        const GG = G.toString(16).padStart(2, '0');
        const BB = B.toString(16).padStart(2, '0');

        return "#"+RR+GG+BB;
    }

    function drawCube(x, y, z, w, h, d, color, faceColor = null) {
        const screenX = (width / 2) + (x - COLS/2) * TILE_SIZE;
        // Raised camera slightly for better view
        const screenY = (height / 2 + 180) - (y * TILE_SIZE * 0.7) + (cameraY * TILE_SIZE * 0.7); 
        const renderY = screenY - z;
        const size = TILE_SIZE;

        // Draw Side (Depth) - Softer shading (-15%)
        ctx.fillStyle = shadeColor(color, -15);
        ctx.fillRect(screenX, renderY + size - d, w * size, d);

        // Draw Top
        ctx.fillStyle = faceColor || color;
        ctx.fillRect(screenX, renderY - d, w * size, size);

        // Draw Side Shadow (Right Face) - Softer shading (-30%)
        ctx.fillStyle = shadeColor(color, -30);
        ctx.beginPath();
        ctx.moveTo(screenX + w*size, renderY - d);
        ctx.lineTo(screenX + w*size, renderY - d + size);
        ctx.lineTo(screenX + w*size + (d/2), renderY - d + size - (d/2));
        ctx.lineTo(screenX + w*size + (d/2), renderY - (d/2) - d);
        ctx.fill();
    }

    // UI Helper for Coin Popups
    function spawnFloatingText(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        // Convert grid world pos to screen pos roughly for UI placement
        const screenX = (width / 2) + (x - COLS/2) * TILE_SIZE;
        const screenY = (height / 2) - (y - cameraY) * (TILE_SIZE * 0.7);
        
        el.style.left = screenX + 'px';
        el.style.top = screenY + 'px';
        uiContainer.appendChild(el);
        // Remove after animation ends
        setTimeout(() => el.remove(), 1000);
    }

    // ---------------------------------------------------------
    // Classes
    // ---------------------------------------------------------

    class Coin {
        constructor(x) {
            this.x = x;
            this.zOffset = 0;
        }
        draw(laneIndex) {
            // Bobbing animation based on global frame count and x position
            this.zOffset = Math.sin((frame + this.x*10) * 0.1) * 5 + 5;
            drawCube(this.x + 0.25, laneIndex, this.zOffset, 0.5, 0.5, 8, COLORS.gold, '#FFFFAA');
        }
    }

    class Player {
        constructor() {
            this.gridX = Math.floor(COLS / 2);
            this.gridY = 0; 
            this.z = 0; 
            this.isMoving = false;
            this.moveProgress = 0;
            this.targetX = this.gridX;
            this.targetY = this.gridY;
            this.startX = this.gridX;
            this.startY = this.gridY;
        }

        move(dx, dy) {
            if (this.isMoving) return;
            
            const nextX = this.gridX + dx;
            const nextY = this.gridY + dy;

            if (nextX < 0 || nextX >= COLS) return;
            if (nextY < this.gridY && dy < 0) return; 

            let lane = lanes.find(l => l.index === nextY);
            if (lane && lane.obstacles[nextX]) return; 

            this.startX = this.gridX;
            this.startY = this.gridY;
            this.targetX = nextX;
            this.targetY = nextY;
            this.isMoving = true;
            this.moveProgress = 0;

            // Score only increases if reaching new distance
            if (nextY > maxDistance) {
                maxDistance = nextY;
                score++;
                updateScoreDisplay();
            }
        }

        update() {
            if (this.isMoving) {
                this.moveProgress += 0.15;
                if (this.moveProgress >= 1) {
                    this.isMoving = false;
                    this.gridX = this.targetX;
                    this.gridY = this.targetY;
                    this.z = 0;
                    checkCollision(); 
                } else {
                    // Higher jump arc
                    this.z = Math.sin(this.moveProgress * Math.PI) * 18;
                }
            }
            if (this.gridY < cameraY - 2) gameOver();
        }

        draw() {
            let renderX = this.gridX;
            let renderY = this.gridY;

            if (this.isMoving) {
                renderX = this.startX + (this.targetX - this.startX) * this.moveProgress;
                renderY = this.startY + (this.targetY - this.startY) * this.moveProgress;
            }

            // Refined Bloomington Student Model
            // Legs
            drawCube(renderX + 0.25, renderY, this.z, 0.2, 0.3, 8, '#222'); 
            drawCube(renderX + 0.55, renderY, this.z, 0.2, 0.3, 8, '#222');
            // Torso (Crimson Hoodie)
            drawCube(renderX + 0.2, renderY, this.z + 8, 0.6, 0.5, 12, COLORS.crimson);
            // Backpack (Cream, slightly more defined)
            drawCube(renderX + 0.15, renderY - 0.15, this.z + 10, 0.7, 0.2, 10, COLORS.cream);
            // Head
            drawCube(renderX + 0.25, renderY, this.z + 20, 0.5, 0.5, 9, '#F5CCB0'); 
            // Hair (Brown)
            drawCube(renderX + 0.25, renderY - 0.05, this.z + 26, 0.5, 0.6, 3, '#4E342E');
        }
    }

    class Lane {
        constructor(index) {
            this.index = index;
            this.type = 'grass';
            this.obstacles = new Array(COLS).fill(false);
            // "Decorations" are small details on grass (tufts, pebbles)
            this.decorations = new Array(COLS).fill(false); 
            this.vehicles = [];
            this.logs = [];
            this.coins = []; // Array to hold coin objects on this lane
            this.speed = 0;
            this.generate();
        }

        generate() {
            // Safe zone at start
            if (this.index < 3) {
                this.type = 'grass';
                if (this.index === 0) {
                    this.obstacles[3] = 'gate_left';
                    this.obstacles[9] = 'gate_right';
                }
                return;
            }

            const rand = Math.random();
            // Road Logic
            if (rand < 0.4) {
                this.type = 'road';
                this.speed = (Math.random() * 0.05 + 0.03) * (Math.random() < 0.5 ? 1 : -1);
                const count = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<count; i++) {
                    this.vehicles.push({
                        x: Math.random() * COLS,
                        type: Math.random() < 0.3 ? 'bus' : 'car'
                    });
                }
            // Grass Logic
            } else if (rand < 0.75) {
                this.type = 'grass';
                for(let i=0; i<COLS; i++) {
                    const obstacleChance = Math.random();
                    if (obstacleChance < 0.15) {
                        this.obstacles[i] = Math.random() < 0.8 ? 'tree' : 'rock';
                    } else if (obstacleChance > 0.6) {
                        // Add subtle decorations if no obstacle
                        const decorType = Math.random();
                        if (decorType < 0.3) this.decorations[i] = 'tuft';
                        else if (decorType < 0.4) this.decorations[i] = 'pebble';
                        else if (decorType < 0.45) this.decorations[i] = 'flower_cream';
                        else if (decorType < 0.5) this.decorations[i] = 'flower_crimson';
                        
                        // Chance for a coin on safe grass
                        if (Math.random() < 0.05 && !this.obstacles[i]) {
                            this.coins.push(new Coin(i));
                        }
                    }
                }
            // Water Logic
            } else {
                this.type = 'water';
                this.speed = (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1);
                const count = Math.floor(Math.random() * 3) + 2;
                for(let i=0; i<count; i++) {
                    let logW = Math.random() < 0.5 ? 2 : 3;
                    let logX = Math.random() * COLS;
                    this.logs.push({
                        x: logX,
                        width: logW
                    });
                    // Chance for coin on a log
                    if (Math.random() < 0.3) {
                         this.coins.push(new Coin(logX + logW/2 - 0.5));
                    }
                }
            }
        }

        update() {
            if (this.type === 'road') {
                this.vehicles.forEach(v => {
                    v.x += this.speed;
                    if (this.speed > 0 && v.x > COLS + 2) v.x = -4;
                    if (this.speed < 0 && v.x < -4) v.x = COLS + 2;
                });
            } else if (this.type === 'water') {
                this.logs.forEach(l => {
                    l.x += this.speed;
                    if (this.speed > 0 && l.x > COLS + 2) l.x = -l.width - 1;
                    if (this.speed < 0 && l.x < -l.width - 1) l.x = COLS + 2;
                });
                // Move coins attached to logs
                 this.coins.forEach(c => {
                    c.x += this.speed;
                 });
            }
        }

        draw() {
            let baseColor = COLORS.grass;
            if (this.index % 2 !== 0) baseColor = COLORS.grassLight;
            if (this.type === 'road') baseColor = COLORS.asphalt;
            if (this.type === 'water') baseColor = COLORS.waterDeep;

            for (let x = 0; x < COLS; x++) {
                let tileColor = baseColor;
                // Limestone sidewalks
                if (this.type === 'grass' && this.index % 2 === 0 && x % 2 === 0) tileColor = COLORS.limestone;
                
                // Draw Ground
                drawCube(x, this.index, -10, 1, 1, 10, tileColor);

                // Draw Water Surface
                if (this.type === 'water') {
                    drawCube(x, this.index, -3, 1, 1, 3, COLORS.water, shadeColor(COLORS.water, 10));
                }

                // Draw Decorations (Grass tufts, pebbles)
                if (this.decorations[x]) {
                    if (this.decorations[x] === 'tuft') drawCube(x+0.3, this.index, 0, 0.4, 0.4, 3, COLORS.grassLight);
                    if (this.decorations[x] === 'pebble') drawCube(x+0.4, this.index, 0, 0.2, 0.2, 2, COLORS.limestoneDark);
                    if (this.decorations[x] === 'flower_cream') drawCube(x+0.4, this.index, 0, 0.2, 0.2, 4, COLORS.cream);
                    if (this.decorations[x] === 'flower_crimson') drawCube(x+0.4, this.index, 0, 0.2, 0.2, 4, COLORS.crimson);
                }

                // Draw Static Obstacles
                if (this.obstacles[x]) {
                    if (this.obstacles[x] === 'tree') {
                        drawCube(x + 0.3, this.index, 0, 0.4, 0.4, 10, COLORS.treeTrunk);
                        let leafColor = COLORS.leaves[Math.floor((x + this.index) % COLORS.leaves.length)];
                        drawCube(x, this.index, 10, 1, 1, 15, leafColor);
                        drawCube(x + 0.2, this.index, 25, 0.6, 0.6, 10, leafColor);
                    } else if (this.obstacles[x] === 'rock') {
                        drawCube(x + 0.1, this.index, 0, 0.8, 0.8, 8, COLORS.limestoneDark);
                    } else if (this.obstacles[x].includes('gate')) {
                        // Sample Gates
                        drawCube(x, this.index, 0, 1, 1, 45, COLORS.limestone);
                        drawCube(x - 0.1, this.index, 40, 1.2, 1.2, 5, shadeColor(COLORS.limestone, -10));
                        // Add a little crimson detail on top
                         drawCube(x + 0.3, this.index, 45, 0.4, 0.4, 2, COLORS.crimson);
                    }
                }
            }

            // Draw Logs
            if (this.type === 'water') {
                this.logs.forEach(l => {
                    drawCube(l.x, this.index, -1, l.width, 0.8, 6, '#5D4037', '#795548');
                });
            }

             // Draw Coins
            this.coins.forEach(coin => {
                // Only draw if within bounds (especially important for water coins moving offscreen)
                if(coin.x > -1 && coin.x < COLS) {
                    coin.draw(this.index);
                }
            });

            // Draw Vehicles
            if (this.type === 'road') {
                this.vehicles.forEach(v => {
                    if (v.type === 'bus') {
                        // Campus Bus - Redesigned slightly
                        drawCube(v.x, this.index, 0, 3.2, 0.9, 14, '#EEEEEE'); // White Body
                        drawCube(v.x + 0.1, this.index, 4, 3.0, 0.9, 6, COLORS.crimson); // Crimson Stripe
                        drawCube(v.x + 0.3, this.index, 12, 2.6, 0.9, 3, '#333'); // Windows
                        // Wheels
                        drawCube(v.x + 0.4, this.index, -1, 0.6, 1, 3, '#111');
                        drawCube(v.x + 2.2, this.index, -1, 0.6, 1, 3, '#111');
                    } else {
                        // Car
                        let carColor = ['#D32F2F', '#FBC02D', '#1976D2'][Math.floor(Math.abs(v.x) % 3)];
                        drawCube(v.x, this.index, 0, 1.8, 0.8, 9, carColor);
                        drawCube(v.x + 0.2, this.index, 9, 1.4, 0.6, 5, '#81D4FA'); // Windows
                    }
                });
            }
        }
    }

    // ---------------------------------------------------------
    // Game Management
    // ---------------------------------------------------------

    function initGame() {
        lanes = [];
        score = 0;
        maxDistance = 0;
        cameraY = 0;
        gameSpeed = 0.002;
        // Fill initial screen
        for(let i=0; i<ROWS_VISIBLE + 5; i++) lanes.push(new Lane(i));
        player = new Player();
        updateScoreDisplay();
    }

    function updateScoreDisplay() {
        document.getElementById('score-display').innerText = score;
    }

    function checkCollision() {
        const currentLane = lanes.find(l => l.index === player.gridY);
        if (!currentLane) return;

        // 1. Coin Collection Check
        // Iterate backwards so we can splice safely
        for (let i = currentLane.coins.length - 1; i >= 0; i--) {
            const coin = currentLane.coins[i];
            // Simple proximity check for pickup
            if (Math.abs(player.gridX - coin.x) < 0.7) {
                // Coin Collected!
                currentLane.coins.splice(i, 1); // Remove coin
                score += 5; // Add bonus points
                updateScoreDisplay();
                // Trigger UI effect
                spawnFloatingText(player.gridX, player.gridY, "+5");
            }
        }

        // 2. Water/Log Check
        if (currentLane.type === 'water') {
            let onLog = false;
            let logSpeed = 0;
            currentLane.logs.forEach(l => {
                // Slightly forgiving bounding box for logs
                if (player.gridX + 0.6 > l.x && player.gridX + 0.4 < l.x + l.width) {
                    onLog = true;
                    logSpeed = currentLane.speed;
                }
            });
            if (onLog) {
                // Ride the log
                player.gridX += logSpeed; 
                player.targetX += logSpeed; 
                player.startX += logSpeed;
            } else {
                if (!player.isMoving) gameOver(); // Drowned
            }
        }
    }

    function checkDynamicCollisions() {
        const pX = player.gridX + 0.5; 
        // Rounding needed because moving logs offset Y slightly in visual terms
        const currentLane = lanes.find(l => l.index === Math.round(player.gridY));
        
        // Vehicle collision
        if (currentLane && currentLane.type === 'road') {
            currentLane.vehicles.forEach(v => {
                const vCenter = v.x + (v.type === 'bus' ? 1.6 : 0.9);
                const vWidth = v.type === 'bus' ? 3.0 : 1.6;
                // Slightly tighter hitboxes
                if (Math.abs(pX - vCenter) < (vWidth / 2)) gameOver();
            });
        }
        // Off-screen bounds check (log riding)
        if (player.gridX < -1 || player.gridX > COLS) gameOver();
    }

    function update() {
        if (!gameActive) return;
        frame++; // Global frame counter for animations

        cameraY += gameSpeed;
        // Keep player from getting too far up screen
        if (player.gridY > cameraY + 7) cameraY = player.gridY - 7;

        const lastLaneIndex = lanes[lanes.length-1].index;
        // Ensure enough lanes ahead
        if (lastLaneIndex < cameraY + ROWS_VISIBLE + 5) {
            lanes.push(new Lane(lastLaneIndex + 1));
        }
        // Cleanup old lanes
        if (lanes[0].index < cameraY - 6) lanes.shift();

        lanes.forEach(l => l.update());
        player.update();
        checkDynamicCollisions();
        
        // Slowly increase speed cap
        if(gameSpeed < 0.015) gameSpeed += 0.000002;
    }

    function render() {
        ctx.clearRect(0, 0, width, height);
        
        // Filter and Sort Lanes (Draw Back to Front painter's algorithm)
        const visibleLanes = lanes.filter(l => l.index > cameraY - 5 && l.index < cameraY + ROWS_VISIBLE + 5);
        visibleLanes.sort((a, b) => b.index - a.index);

        visibleLanes.forEach(lane => {
            lane.draw();
            // Determine when to draw the player relative to the lanes for depth
            let playerRenderY = player.isMoving ? 
                player.startY + (player.targetY - player.startY) * player.moveProgress : 
                player.gridY;
            // Draw player when rendering the lane directly "beneath" them visually
            if (Math.round(playerRenderY) === lane.index) player.draw();
        });
    }

    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }

    // ---------------------------------------------------------
    // Input Handling
    // ---------------------------------------------------------

    function handleInput(key) {
        if (!gameActive) return;
        switch(key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    }

    window.addEventListener('keydown', e => handleInput(e.key));

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        e.preventDefault(); // Prevent default scrolling actions
    }, {passive: false});

    window.addEventListener('touchend', e => {
        if (!gameActive) return;
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        // Determine swipe direction vs tap
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
            handleInput(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 30) {
             handleInput(dy < 0 ? 'ArrowUp' : 'ArrowDown');
        } else {
             handleInput('ArrowUp'); // Tap defaults to forward
        }
        e.preventDefault();
    }, {passive: false});

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        initGame();
        gameActive = true;
    }

    function resetGame() { startGame(); }
    
    function gameOver() {
        if(!gameActive) return; // Prevent double trigger
        gameActive = false;
        document.getElementById('game-over-screen').classList.remove('hidden');
        // Show final score combined
        document.getElementById('final-score-text').innerText = `Final Score: ${score}`;
    }

    // Start main loop
    initGame();
    loop();

</script>
</body>
</html>
