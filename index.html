<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Passing Through Town: Bloomington Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Press Start 2P', cursive;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
        }

        canvas {
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .score-board {
            font-size: 40px;
            color: white;
            text-shadow: 4px 4px 0px #7D110C;
            text-align: left;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            color: #F3E5AB;
            text-shadow: 4px 4px 0px #7D110C;
            text-align: center;
            line-height: 1.5;
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 14px;
            color: #ddd;
            text-align: center;
            line-height: 1.6;
            max-width: 600px;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            background-color: #7D110C;
            color: #F3E5AB;
            border: 4px solid #fff;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #4a0a07;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a0a07;
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="score-board" id="score-display">0</div>
    </div>

    <div id="start-screen">
        <h1>PASSING THROUGH<br>TOWN</h1>
        <p>Welcome to Bloomington.<br>Get to class without getting hit by the Campus Bus or falling into the Jordan River.</p>
        <p style="color: #F3E5AB; margin-top:10px;">Arrow Keys / WASD to Move</p>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>BUMMER!</h1>
        <p id="final-score-text">Score: 0</p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <div class="controls-hint">Tap screen or use Arrow Keys</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game Constants
    const TILE_SIZE = 40;
    const COLS = 13; 
    const ROWS_VISIBLE = 16;
    
    // Bloomington Color Palette (All 6-digit Hex for safety)
    const COLORS = {
        crimson: '#7D110C',
        cream: '#F3E5AB',
        asphalt: '#333333',
        grass: '#4A6B3E', 
        grassLight: '#5C8A4E',
        water: '#4FC3F7',
        waterDeep: '#0288D1',
        limestone: '#D8D8D6',
        limestoneDark: '#A0A0A0',
        treeTrunk: '#5D4037',
        leavesOrange: '#E65100',
        leavesRed: '#B71C1C',
        leavesYellow: '#FBC02D'
    };

    let width, height;
    let gameActive = false;
    let score = 0;
    let lanes = [];
    let player;
    let cameraY = 0;
    let gameSpeed = 0.002;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------------------------------------------------------
    // Rendering Helpers
    // ---------------------------------------------------------
    
    // Fixed Shadow Function (Handles inputs safely)
    function shadeColor(color, percent) {
        if (!color) return '#000000';
        
        // Ensure 6 digit hex
        if (color.length === 4) {
            color = '#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
        }

        let R = parseInt(color.substring(1,3),16);
        let G = parseInt(color.substring(3,5),16);
        let B = parseInt(color.substring(5,7),16);

        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);

        R = (R<255)?R:255;  
        G = (G<255)?G:255;  
        B = (B<255)?B:255; 

        // Clamp to 0
        R = (R>0)?R:0;
        G = (G>0)?G:0;
        B = (B>0)?B:0;

        const RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
        const GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
        const BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

        return "#"+RR+GG+BB;
    }

    function drawCube(x, y, z, w, h, d, color, faceColor = null) {
        // Isometric Projection Logic
        const screenX = (width / 2) + (x - COLS/2) * TILE_SIZE;
        // The cameraY logic moves the world down as camera index increases
        const screenY = (height / 2 + 150) - (y * TILE_SIZE * 0.7) + (cameraY * TILE_SIZE * 0.7); 
        const renderY = screenY - z;
        const size = TILE_SIZE;

        // Draw Side (Depth)
        ctx.fillStyle = shadeColor(color, -20);
        ctx.fillRect(screenX, renderY + size - d, w * size, d);

        // Draw Top
        ctx.fillStyle = faceColor || color;
        ctx.fillRect(screenX, renderY - d, w * size, size);

        // Draw Side Shadow (Right Face)
        ctx.fillStyle = shadeColor(color, -40);
        ctx.beginPath();
        ctx.moveTo(screenX + w*size, renderY - d);
        ctx.lineTo(screenX + w*size, renderY - d + size);
        ctx.lineTo(screenX + w*size + (d/2), renderY - d + size - (d/2));
        ctx.lineTo(screenX + w*size + (d/2), renderY - (d/2) - d);
        ctx.fill();
    }

    // ---------------------------------------------------------
    // Classes
    // ---------------------------------------------------------

    class Player {
        constructor() {
            this.gridX = Math.floor(COLS / 2);
            this.gridY = 0; 
            this.z = 0; 
            this.isMoving = false;
            this.moveProgress = 0;
            this.targetX = this.gridX;
            this.targetY = this.gridY;
            this.startX = this.gridX;
            this.startY = this.gridY;
        }

        move(dx, dy) {
            if (this.isMoving) return;
            
            const nextX = this.gridX + dx;
            const nextY = this.gridY + dy;

            if (nextX < 0 || nextX >= COLS) return;
            if (nextY < this.gridY && dy < 0) return; 

            // Check Obstacles
            let lane = lanes.find(l => l.index === nextY);
            if (lane && lane.obstacles[nextX]) return; 

            this.startX = this.gridX;
            this.startY = this.gridY;
            this.targetX = nextX;
            this.targetY = nextY;
            this.isMoving = true;
            this.moveProgress = 0;

            if (nextY > score) {
                score = nextY;
                document.getElementById('score-display').innerText = score;
            }
        }

        update() {
            if (this.isMoving) {
                this.moveProgress += 0.15;
                if (this.moveProgress >= 1) {
                    this.isMoving = false;
                    this.gridX = this.targetX;
                    this.gridY = this.targetY;
                    this.z = 0;
                    checkCollision(); 
                } else {
                    this.z = Math.sin(this.moveProgress * Math.PI) * 15;
                }
            }
            if (this.gridY < cameraY - 2) gameOver();
        }

        draw() {
            let renderX = this.gridX;
            let renderY = this.gridY;

            if (this.isMoving) {
                renderX = this.startX + (this.targetX - this.startX) * this.moveProgress;
                renderY = this.startY + (this.targetY - this.startY) * this.moveProgress;
            }

            // Bloomington Student
            drawCube(renderX + 0.2, renderY, this.z, 0.2, 0.4, 10, '#222222'); // Left Leg
            drawCube(renderX + 0.6, renderY, this.z, 0.2, 0.4, 10, '#222222'); // Right Leg
            drawCube(renderX + 0.15, renderY, this.z + 10, 0.7, 0.6, 15, COLORS.crimson); // Hoodie
            drawCube(renderX + 0.2, renderY - 0.2, this.z + 14, 0.6, 0.2, 10, COLORS.cream); // Backpack
            drawCube(renderX + 0.25, renderY, this.z + 25, 0.5, 0.5, 10, '#F5CCB0'); // Head
            drawCube(renderX + 0.25, renderY, this.z + 33, 0.5, 0.5, 4, '#3E2723'); // Hair
        }
    }

    class Lane {
        constructor(index) {
            this.index = index;
            this.type = 'grass';
            this.obstacles = new Array(COLS).fill(false);
            this.vehicles = [];
            this.logs = [];
            this.speed = 0;
            this.generate();
        }

        generate() {
            if (this.index < 3) {
                this.type = 'grass';
                if (this.index === 0) {
                    this.obstacles[3] = 'gate_left';
                    this.obstacles[9] = 'gate_right';
                }
                return;
            }

            const rand = Math.random();
            if (rand < 0.4) {
                this.type = 'road';
                this.speed = (Math.random() * 0.05 + 0.03) * (Math.random() < 0.5 ? 1 : -1);
                const count = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<count; i++) {
                    this.vehicles.push({
                        x: Math.random() * COLS,
                        type: Math.random() < 0.3 ? 'bus' : 'car'
                    });
                }
            } else if (rand < 0.7) {
                this.type = 'grass';
                for(let i=0; i<COLS; i++) {
                    if (Math.random() < 0.2) {
                        this.obstacles[i] = Math.random() < 0.8 ? 'tree' : 'rock';
                    }
                }
            } else {
                this.type = 'water';
                this.speed = (Math.random() * 0.04 + 0.02) * (Math.random() < 0.5 ? 1 : -1);
                const count = Math.floor(Math.random() * 3) + 2;
                for(let i=0; i<count; i++) {
                    this.logs.push({
                        x: Math.random() * COLS,
                        width: Math.random() < 0.5 ? 2 : 3
                    });
                }
            }
        }

        update() {
            if (this.type === 'road') {
                this.vehicles.forEach(v => {
                    v.x += this.speed;
                    if (this.speed > 0 && v.x > COLS + 2) v.x = -3;
                    if (this.speed < 0 && v.x < -3) v.x = COLS + 2;
                });
            } else if (this.type === 'water') {
                this.logs.forEach(l => {
                    l.x += this.speed;
                    if (this.speed > 0 && l.x > COLS + 2) l.x = -l.width - 1;
                    if (this.speed < 0 && l.x < -l.width - 1) l.x = COLS + 2;
                });
            }
        }

        draw() {
            let baseColor = COLORS.grass;
            if (this.index % 2 !== 0) baseColor = COLORS.grassLight;
            if (this.type === 'road') baseColor = COLORS.asphalt;
            if (this.type === 'water') baseColor = COLORS.waterDeep;

            for (let x = 0; x < COLS; x++) {
                let tileColor = baseColor;
                if (this.type === 'grass' && this.index % 2 === 0 && x % 2 === 0) tileColor = COLORS.limestone;
                
                drawCube(x, this.index, -10, 1, 1, 10, tileColor);

                if (this.type === 'water') {
                    drawCube(x, this.index, -2, 1, 1, 2, COLORS.water, COLORS.water);
                }

                if (this.obstacles[x]) {
                    if (this.obstacles[x] === 'tree') {
                        drawCube(x + 0.3, this.index, 0, 0.4, 0.4, 10, COLORS.treeTrunk);
                        let leafColor = [COLORS.leavesOrange, COLORS.leavesRed, COLORS.leavesYellow][Math.floor(Math.random()*3)];
                        drawCube(x, this.index, 10, 1, 1, 15, leafColor);
                        drawCube(x + 0.2, this.index, 25, 0.6, 0.6, 10, leafColor);
                    } else if (this.obstacles[x] === 'rock') {
                        drawCube(x + 0.1, this.index, 0, 0.8, 0.8, 8, COLORS.limestoneDark);
                    } else if (this.obstacles[x].includes('gate')) {
                        drawCube(x, this.index, 0, 1, 1, 40, COLORS.limestone);
                        drawCube(x - 0.1, this.index, 35, 1.2, 1.2, 5, COLORS.limestoneDark);
                    }
                }
            }

            if (this.type === 'water') {
                this.logs.forEach(l => {
                    drawCube(l.x, this.index, 0, l.width, 0.8, 5, '#5D4037', '#795548');
                });
            }

            if (this.type === 'road') {
                this.vehicles.forEach(v => {
                    if (v.type === 'bus') {
                        drawCube(v.x, this.index, 0, 2.5, 0.9, 15, '#FFFFFF');
                        drawCube(v.x, this.index, 5, 2.5, 0.9, 5, COLORS.crimson);
                        drawCube(v.x + 0.2, this.index, 15, 2.1, 0.9, 2, '#333333'); 
                    } else {
                        let carColor = ['#1E88E5', '#FDD835', '#43A047'][Math.floor(v.x % 3)];
                        drawCube(v.x, this.index, 0, 1.5, 0.8, 10, carColor);
                        drawCube(v.x + 0.2, this.index, 10, 1.1, 0.6, 5, '#AACCEE'); 
                    }
                });
            }
        }
    }

    // ---------------------------------------------------------
    // Game Management
    // ---------------------------------------------------------

    function initGame() {
        lanes = [];
        score = 0;
        cameraY = 0;
        gameSpeed = 0.002;
        for(let i=0; i<25; i++) lanes.push(new Lane(i));
        player = new Player();
    }

    function checkCollision() {
        const currentLane = lanes.find(l => l.index === player.gridY);
        if (!currentLane) return;

        if (currentLane.type === 'water') {
            let onLog = false;
            let logSpeed = 0;
            currentLane.logs.forEach(l => {
                if (player.gridX + 0.5 > l.x && player.gridX + 0.5 < l.x + l.width) {
                    onLog = true;
                    logSpeed = currentLane.speed;
                }
            });
            if (onLog) {
                player.gridX += logSpeed; 
                player.targetX += logSpeed; 
                player.startX += logSpeed;
            } else {
                if (!player.isMoving) gameOver();
            }
        }
    }

    function checkDynamicCollisions() {
        const pX = player.gridX + 0.5; 
        const currentLane = lanes.find(l => l.index === Math.round(player.gridY));
        
        if (currentLane && currentLane.type === 'road') {
            currentLane.vehicles.forEach(v => {
                const vCenter = v.x + (v.type === 'bus' ? 1.25 : 0.75);
                const vWidth = v.type === 'bus' ? 2.5 : 1.5;
                if (Math.abs(pX - vCenter) < (vWidth / 2) + 0.3) gameOver();
            });
        }
        if (player.gridX < -1 || player.gridX > COLS) gameOver();
    }

    function update() {
        if (!gameActive) return;

        cameraY += gameSpeed;
        if (player.gridY > cameraY + 6) cameraY = player.gridY - 6;

        const lastLaneIndex = lanes[lanes.length-1].index;
        if (lastLaneIndex < cameraY + ROWS_VISIBLE + 5) {
            lanes.push(new Lane(lastLaneIndex + 1));
        }

        if (lanes[0].index < cameraY - 5) lanes.shift();

        lanes.forEach(l => l.update());
        player.update();
        checkDynamicCollisions();
        gameSpeed += 0.000005;
    }

    function render() {
        ctx.clearRect(0, 0, width, height);
        
        // Filter and Sort Lanes (Draw Back to Front)
        const visibleLanes = lanes.filter(l => l.index > cameraY - 2 && l.index < cameraY + ROWS_VISIBLE + 5);
        visibleLanes.sort((a, b) => b.index - a.index);

        visibleLanes.forEach(lane => {
            lane.draw();
            let playerRenderY = player.isMoving ? 
                player.startY + (player.targetY - player.startY) * player.moveProgress : 
                player.gridY;
            if (Math.round(playerRenderY) === lane.index) player.draw();
        });
    }

    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }

    // ---------------------------------------------------------
    // Input Handling
    // ---------------------------------------------------------

    function handleInput(key) {
        if (!gameActive) return;
        switch(key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    }

    window.addEventListener('keydown', e => handleInput(e.key));

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: false});

    window.addEventListener('touchend', e => {
        if (!gameActive) return;
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (Math.abs(dx) > 30) handleInput(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
        } else {
            if (Math.abs(dy) > 30) handleInput(dy < 0 ? 'ArrowUp' : 'ArrowDown');
            else handleInput('ArrowUp');
        }
    }, {passive: false});

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('score-display').innerText = '0';
        initGame();
        gameActive = true;
    }

    function resetGame() { startGame(); }
    function gameOver() {
        gameActive = false;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score-text').innerText = `Score: ${score}`;
    }

    initGame();
    loop();

</script>
</body>
</html>
