<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Casino – Walking Gambler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #020617, #000);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      height: 540px;
      border-radius: 20px;
      overflow: hidden;
      background: #020617;
      box-shadow: 0 28px 60px rgba(0,0,0,0.95);
      border: 1px solid rgba(148,163,184,0.4);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 0%, #020617, #020617 45%, #000014 100%);
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.6);
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 4;
    }

    #hud span.label {
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.09em;
      opacity: 0.8;
    }

    #hud span.value {
      font-weight: 700;
    }

    #hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.88);
      border: 1px solid rgba(148,163,184,0.5);
      font-size: 12px;
      z-index: 3;
      min-width: 220px;
      text-align: center;
      opacity: 0.9;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15,23,42,0.92);
      z-index: 10;
    }

    #overlay.active {
      display: flex;
    }

    #overlayInner {
      width: 360px;
      max-width: 90%;
      padding: 18px 20px 16px;
      border-radius: 16px;
      background: radial-gradient(circle at top, #020617, #020617 55%, #020617 100%);
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: 0 18px 40px rgba(0,0,0,0.8);
    }

    #overlayTitle {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    #overlaySubtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 10px;
    }

    #overlayContent {
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 60px;
    }

    .slot-reels {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin: 8px 0 10px;
    }

    .slot-reel {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.7);
      background: radial-gradient(circle at top, #111827, #020617);
      font-size: 20px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #22d3ee);
      color: #020617;
      box-shadow: 0 3px 0 #0f766e;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
    }

    button.secondary {
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: none;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 1px 0 #0f766e;
    }

    .bet-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .bet-buttons button {
      padding: 6px 10px;
      font-size: 11px;
    }

    .input-row {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-row input {
      width: 80px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.7);
      background: #020617;
      color: #e5e7eb;
      font-size: 12px;
    }

    .small-text {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="900" height="540"></canvas>

    <div id="hud">
      <span class="label">Balance</span>
      <span class="value" id="balanceText">$1000</span>
      <span class="label">Last Result</span>
      <span class="value" id="lastResultText">–</span>
    </div>

    <div id="hint">Use WASD / Arrow keys to walk. Find a game and press E to play.</div>

    <!-- Mini-game overlay -->
    <div id="overlay">
      <div id="overlayInner">
        <div id="overlayTitle">Game Title</div>
        <div id="overlaySubtitle">Subtitle</div>
        <div id="overlayContent"></div>
        <div class="btn-row" id="overlayButtons"></div>
      </div>
    </div>
  </div>

  <script>
    // ======== BASIC SETUP ========
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const balanceText = document.getElementById("balanceText");
    const lastResultText = document.getElementById("lastResultText");
    const hintEl = document.getElementById("hint");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySubtitle = document.getElementById("overlaySubtitle");
    const overlayContent = document.getElementById("overlayContent");
    const overlayButtons = document.getElementById("overlayButtons");

    let balance = 1000;
    let lastResult = "–";

    function updateHUD() {
      balanceText.textContent = "$" + balance.toFixed(0);
      lastResultText.textContent = lastResult;
    }

    // ======== WORLD / PLAYER ========
    const player = {
      x: WIDTH / 2,
      y: HEIGHT - 80,
      size: 20,
      speed: 200,
      color: "#22d3ee"
    };

    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    let gameState = "walking"; // "walking" | "mini"

    // Casino games as stations you walk up to
    const stations = [
      {
        x: WIDTH / 2 - 140,
        y: HEIGHT / 2 - 60,
        w: 80,
        h: 40,
        type: "slots",
        label: "Slots"
      },
      {
        x: WIDTH / 2 + 60,
        y: HEIGHT / 2 - 60,
        w: 80,
        h: 40,
        type: "hilo",
        label: "Hi–Lo"
      },
      {
        x: WIDTH / 2 - 40,
        y: HEIGHT / 2 + 80,
        w: 80,
        h: 40,
        type: "reset",
        label: "Cashier"
      }
    ];

    function distance(x1,y1,x2,y2){
      const dx = x1 - x2;
      const dy = y1 - y2;
      return Math.sqrt(dx*dx + dy*dy);
    }

    let nearStation = null;

    // ======== INPUT ========
    window.addEventListener("keydown", (e) => {
      if (gameState === "mini") {
        // When in mini-game, only Esc to exit is handled in overlay buttons
        return;
      }

      if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
      if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = true;
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;

      if (e.code === "KeyE") {
        // Try to open a station if near one
        if (nearStation && gameState === "walking") {
          openStation(nearStation);
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
      if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    // ======== MINI-GAME OVERLAY HELPER ========
    function showOverlay() {
      overlay.classList.add("active");
      gameState = "mini";
    }

    function hideOverlay() {
      overlay.classList.remove("active");
      gameState = "walking";
      lastResult = "Back to casino";
      updateHUD();
    }

    function clearOverlayButtons() {
      while (overlayButtons.firstChild) {
        overlayButtons.removeChild(overlayButtons.firstChild);
      }
    }

    function addOverlayButton(text, className, onClick) {
      const btn = document.createElement("button");
      btn.textContent = text;
      if (className) btn.classList.add(className);
      btn.addEventListener("click", onClick);
      overlayButtons.appendChild(btn);
    }

    // ======== STATION HANDLING ========
    function openStation(station) {
      if (station.type === "slots") {
        openSlotsGame();
      } else if (station.type === "hilo") {
        openHiLoGame();
      } else if (station.type === "reset") {
        openCashier();
      }
    }

    // ======== SLOTS GAME ========
    function openSlotsGame() {
      overlayTitle.textContent = "Neon Slots";
      overlaySubtitle.textContent = "Bet fake chips. 3 of a kind wins big. Symbols: 🍒, 🍋, ⭐, 💎";
      overlayContent.innerHTML = "";

      const reelContainer = document.createElement("div");
      reelContainer.className = "slot-reels";

      const reel1 = document.createElement("div");
      const reel2 = document.createElement("div");
      const reel3 = document.createElement("div");
      reel1.className = reel2.className = reel3.className = "slot-reel";

      reel1.textContent = "❔";
      reel2.textContent = "❔";
      reel3.textContent = "❔";

      reelContainer.appendChild(reel1);
      reelContainer.appendChild(reel2);
      reelContainer.appendChild(reel3);

      overlayContent.appendChild(reelContainer);

      const msg = document.createElement("div");
      msg.className = "small-text";
      msg.textContent = "Choose a bet & press Spin. This is all fake money – just for fun.";
      overlayContent.appendChild(msg);

      clearOverlayButtons();

      const betAmounts = [10, 25, 50, 100];
      let currentBet = 25;

      const betRow = document.createElement("div");
      betRow.className = "bet-buttons";

      betAmounts.forEach(amount => {
        const b = document.createElement("button");
        b.textContent = "$" + amount;
        b.addEventListener("click", () => {
          currentBet = amount;
          msg.textContent = "Bet set to $" + currentBet + ". Press Spin.";
        });
        betRow.appendChild(b);
      });

      overlayContent.appendChild(betRow);

      addOverlayButton("Spin", null, () => {
        if (balance < currentBet) {
          msg.textContent = "Not enough fake chips for that bet.";
          lastResult = "Insufficient chips on Slots";
          updateHUD();
          return;
        }

        balance -= currentBet;

        const symbols = ["🍒", "🍋", "⭐", "💎"];
        const r1 = symbols[Math.floor(Math.random() * symbols.length)];
        const r2 = symbols[Math.floor(Math.random() * symbols.length)];
        const r3 = symbols[Math.floor(Math.random() * symbols.length)];

        reel1.textContent = r1;
        reel2.textContent = r2;
        reel3.textContent = r3;

        let payout = 0;
        if (r1 === r2 && r2 === r3) {
          if (r1 === "🍒") payout = currentBet * 5;
          else if (r1 === "🍋") payout = currentBet * 8;
          else if (r1 === "⭐") payout = currentBet * 12;
          else if (r1 === "💎") payout = currentBet * 20;
        } else if (r1 === r2 || r2 === r3 || r1 === r3) {
          payout = currentBet * 2;
        }

        if (payout > 0) {
          balance += payout;
          msg.textContent = `You won $${payout} in fake chips!`;
          lastResult = `Slots +$${payout - currentBet}`;
        } else {
          msg.textContent = `No win. You lost $${currentBet}.`;
          lastResult = `Slots -$${currentBet}`;
        }
        updateHUD();
      });

      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      showOverlay();
    }

    // ======== HI–LO GAME ========
    function openHiLoGame() {
      overlayTitle.textContent = "Hi–Lo Table";
      overlaySubtitle.textContent = "Bet on whether the next card (1–13) is high (8–13) or low (1–6). 7 is house win.";

      overlayContent.innerHTML = "";

      const status = document.createElement("div");
      status.textContent = "Place a bet and choose High or Low.";
      status.style.marginBottom = "6px";
      overlayContent.appendChild(status);

      const inputRow = document.createElement("div");
      inputRow.className = "input-row";

      const label = document.createElement("span");
      label.textContent = "Bet $";

      const betInput = document.createElement("input");
      betInput.type = "number";
      betInput.value = "50";
      betInput.min = "1";

      inputRow.appendChild(label);
      inputRow.appendChild(betInput);
      overlayContent.appendChild(inputRow);

      const small = document.createElement("div");
      small.className = "small-text";
      small.textContent = "This is fake money only. Win: 2× bet. Lose: lose your bet.";
      overlayContent.appendChild(small);

      clearOverlayButtons();

      addOverlayButton("Bet High (8–13)", null, () => {
        playHiLoRound("high");
      });

      addOverlayButton("Bet Low (1–6)", null, () => {
        playHiLoRound("low");
      });

      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      function playHiLoRound(choice) {
        let bet = parseInt(betInput.value, 10);
        if (isNaN(bet) || bet <= 0) {
          status.textContent = "Enter a valid positive bet.";
          return;
        }
        if (balance < bet) {
          status.textContent = "Not enough fake chips for that bet.";
          lastResult = "Insufficient chips on Hi–Lo";
          updateHUD();
          return;
        }

        balance -= bet;

        const card = Math.floor(Math.random() * 13) + 1; // 1–13
        let outcome = "";
        let payout = 0;

        if (card === 7) {
          outcome = `Card is 7. House wins. You lose $${bet}.`;
          lastResult = `Hi–Lo -$${bet}`;
        } else if (card >= 8 && choice === "high") {
          payout = bet * 2;
          balance += payout;
          outcome = `Card is ${card} (High). You win $${payout}!`;
          lastResult = `Hi–Lo +$${payout - bet}`;
        } else if (card <= 6 && choice === "low") {
          payout = bet * 2;
          balance += payout;
          outcome = `Card is ${card} (Low). You win $${payout}!`;
          lastResult = `Hi–Lo +$${payout - bet}`;
        } else {
          outcome = `Card is ${card}. You lose $${bet}.`;
          lastResult = `Hi–Lo -$${bet}`;
        }

        status.textContent = outcome;
        updateHUD();
      }

      showOverlay();
    }

    // ======== CASHIER (RESET) ========
    function openCashier() {
      overlayTitle.textContent = "Cashier";
      overlaySubtitle.textContent = "Reset your fake chips if you go broke or just want to start over.";

      overlayContent.innerHTML = `
        <div style="font-size:13px; margin-bottom:6px;">
          Current balance: <b>$${balance.toFixed(0)}</b>
        </div>
        <div class="small-text">
          This is all pretend money. Use this to refill your chips to keep playing.
        </div>
      `;

      clearOverlayButtons();

      addOverlayButton("Reset to $1000", null, () => {
        balance = 1000;
        lastResult = "Cashier reset to $1000";
        updateHUD();
        hideOverlay();
      });

      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      showOverlay();
    }

    // ======== UPDATE / DRAW ========
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (gameState === "walking") {
        update(dt);
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      let dx = 0;
      let dy = 0;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;

      const length = Math.sqrt(dx*dx + dy*dy);
      if (length > 0) {
        dx /= length;
        dy /= length;
      }

      player.x += dx * player.speed * dt;
      player.y += dy * player.speed * dt;

      // Boundaries of casino floor
      const margin = 40;
      if (player.x < margin) player.x = margin;
      if (player.x > WIDTH - margin) player.x = WIDTH - margin;
      if (player.y < margin + 20) player.y = margin + 20;
      if (player.y > HEIGHT - margin) player.y = HEIGHT - margin;

      // Check proximity to stations
      nearStation = null;
      let minDist = 50;
      stations.forEach(st => {
        const cx = st.x + st.w / 2;
        const cy = st.y + st.h / 2;
        const d = distance(player.x, player.y, cx, cy);
        if (d < minDist) {
          minDist = d;
          nearStation = st;
        }
      });

      if (nearStation) {
        let name = nearStation.label;
        if (nearStation.type === "reset") {
          hintEl.textContent = `Press E to talk to the ${name} (reset fake chips).`;
        } else {
          hintEl.textContent = `Press E to play ${name}.`;
        }
      } else {
        hintEl.textContent = "Use WASD / Arrow keys to walk. Find a table and press E to play.";
      }
    }

    function render() {
      // Background floor
      ctx.clearRect(0,0,WIDTH,HEIGHT);

      // Carpet pattern
      const grad = ctx.createLinearGradient(0,0,WIDTH,HEIGHT);
      grad.addColorStop(0,"#020617");
      grad.addColorStop(1,"#020617");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,WIDTH,HEIGHT);

      // Soft grid to feel like floor
      ctx.strokeStyle = "rgba(15,23,42,0.5)";
      ctx.lineWidth = 1;
      const cellSize = 40;
      for (let x=0; x<WIDTH; x+=cellSize) {
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,HEIGHT);
        ctx.stroke();
      }
      for (let y=0; y<HEIGHT; y+=cellSize) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(WIDTH,y);
        ctx.stroke();
      }

      // Walls
      ctx.fillStyle = "#020617";
      ctx.fillRect(0,0,WIDTH,26);
      ctx.fillRect(0,HEIGHT-26,WIDTH,26);
      ctx.fillRect(0,0,26,HEIGHT);
      ctx.fillRect(WIDTH-26,0,26,HEIGHT);

      // Stations (tables / machines)
      stations.forEach(st => {
        let color = "#1f2937";
        if (st.type === "slots") color = "#4c1d95";
        if (st.type === "hilo") color = "#075985";
        if (st.type === "reset") color = "#14532d";

        ctx.fillStyle = color;
        ctx.fillRect(st.x, st.y, st.w, st.h);

        ctx.strokeStyle = "rgba(248,250,252,0.6)";
        ctx.strokeRect(st.x, st.y, st.w, st.h);

        // Label
        ctx.fillStyle = "rgba(248,250,252,0.9)";
        ctx.font = "12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(st.label, st.x + st.w / 2, st.y - 6);
      });

      // Player
      // Shadow
      ctx.fillStyle = "rgba(15,23,42,0.7)";
      ctx.beginPath();
      ctx.arc(player.x, player.y + player.size/2, player.size*0.5, 0, Math.PI*2);
      ctx.fill();

      // Body
      ctx.fillStyle = player.color;
      ctx.fillRect(
        player.x - player.size/2,
        player.y - player.size/2,
        player.size,
        player.size
      );

      // Outline
      ctx.strokeStyle = "rgba(15,23,42,0.95)";
      ctx.lineWidth = 2;
      ctx.strokeRect(
        player.x - player.size/2,
        player.y - player.size/2,
        player.size,
        player.size
      );

      // Face
      const inner = player.size * 0.55;
      ctx.fillStyle = "rgba(15,23,42,0.9)";
      ctx.fillRect(
        player.x - inner/2,
        player.y - inner/2,
        inner,
        inner
      );

      // Eyes
      ctx.fillStyle = "#e5e7eb";
      const eyeOffset = inner * 0.18;
      const eyeSize = 3;
      ctx.beginPath();
      ctx.arc(player.x - eyeOffset, player.y - eyeOffset, eyeSize, 0, Math.PI*2);
      ctx.arc(player.x + eyeOffset, player.y - eyeOffset, eyeSize, 0, Math.PI*2);
      ctx.fill();
    }

    // ======== START ========
    updateHUD();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
