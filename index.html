<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Casino – Walking Gambler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #020617, #000);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      height: 540px;
      border-radius: 20px;
      overflow: hidden;
      background: #020617;
      box-shadow: 0 28px 60px rgba(0,0,0,0.95);
      border: 1px solid rgba(148,163,184,0.4);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 0%, #020617, #020617 45%, #000014 100%);
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.6);
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 4;
    }

    #hud span.label {
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.09em;
      opacity: 0.8;
    }

    #hud span.value {
      font-weight: 700;
    }

    #hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.88);
      border: 1px solid rgba(148,163,184,0.5);
      font-size: 12px;
      z-index: 3;
      min-width: 260px;
      text-align: center;
      opacity: 0.9;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15,23,42,0.92);
      z-index: 10;
    }

    #overlay.active {
      display: flex;
    }

    #overlayInner {
      width: 400px;
      max-width: 90%;
      padding: 18px 20px 16px;
      border-radius: 16px;
      background: radial-gradient(circle at top, #020617, #020617 55%, #020617 100%);
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: 0 18px 40px rgba(0,0,0,0.8);
    }

    #overlayTitle {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    #overlaySubtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 10px;
    }

    #overlayContent {
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 80px;
    }

    .slot-reels {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 8px 0 10px;
    }

    .slot-reel {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.7);
      background: radial-gradient(circle at top, #111827, #020617);
      font-size: 22px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #22d3ee);
      color: #020617;
      box-shadow: 0 3px 0 #0f766e;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
    }

    button.secondary {
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: none;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 1px 0 #0f766e;
    }

    .bet-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .bet-buttons button {
      padding: 6px 10px;
      font-size: 11px;
    }

    .input-row {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .input-row input {
      width: 80px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.7);
      background: #020617;
      color: #e5e7eb;
      font-size: 12px;
    }

    .input-row input.big {
      width: 100px;
    }

    .small-text {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .card-display {
      width: 70px;
      height: 90px;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.8);
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 4px 0 8px;
    }

    .dice-row {
      display: flex;
      gap: 8px;
      margin: 6px 0 8px;
      justify-content: center;
    }

    .die-display {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.8);
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .roulette-wrapper {
      text-align: center;
      margin-bottom: 6px;
    }

    .roulette-wheel {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(148,163,184,0.8);
      margin: 4px auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: conic-gradient(
        #16a34a 0deg 10deg,
        #991b1b 10deg 30deg,
        #111827 30deg 50deg,
        #991b1b 50deg 70deg,
        #111827 70deg 90deg,
        #991b1b 90deg 110deg,
        #111827 110deg 130deg,
        #991b1b 130deg 150deg,
        #111827 150deg 170deg,
        #991b1b 170deg 190deg,
        #111827 190deg 210deg,
        #991b1b 210deg 230deg,
        #111827 230deg 250deg,
        #991b1b 250deg 270deg,
        #111827 270deg 290deg,
        #991b1b 290deg 310deg,
        #111827 310deg 330deg,
        #991b1b 330deg 350deg,
        #16a34a 350deg 360deg
      );
      color: #e5e7eb;
      position: relative;
      transform: rotate(0deg);
    }

    .roulette-wheel-number {
      position: relative;
      z-index: 2;
    }

    .roulette-pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 8px solid #fbbf24;
    }

    .roulette-number-text {
      font-size: 11px;
      opacity: 0.85;
    }

    .double-wheel {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(148,163,184,0.8);
      margin: 4px auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: conic-gradient(
        #15803d 0deg 180deg,
        #991b1b 180deg 360deg
      );
      color: #e5e7eb;
      position: relative;
      transform: rotate(0deg);
    }

    .double-pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 7px solid #eab308;
    }

    .hand-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 4px 0;
    }

    .hand-label {
      font-size: 12px;
      opacity: 0.8;
    }

    .cards-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }

    .card-small {
      width: 40px;
      height: 56px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.8);
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="900" height="540"></canvas>

    <div id="hud">
      <span class="label">Balance</span>
      <span class="value" id="balanceText">$1000</span>
      <span class="label">Last Result</span>
      <span class="value" id="lastResultText">–</span>
    </div>

    <div id="hint">Use WASD / Arrow keys to walk. Find a table and press E to play.</div>

    <!-- Mini-game overlay -->
    <div id="overlay">
      <div id="overlayInner">
        <div id="overlayTitle">Game Title</div>
        <div id="overlaySubtitle">Subtitle</div>
        <div id="overlayContent"></div>
        <div class="btn-row" id="overlayButtons"></div>
      </div>
    </div>
  </div>

  <script>
    // ======== BASIC SETUP ========
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const balanceText = document.getElementById("balanceText");
    const lastResultText = document.getElementById("lastResultText");
    const hintEl = document.getElementById("hint");

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySubtitle = document.getElementById("overlaySubtitle");
    const overlayContent = document.getElementById("overlayContent");
    const overlayButtons = document.getElementById("overlayButtons");

    let balance = 1000;
    let lastResult = "–";

    function updateHUD() {
      balanceText.textContent = "$" + balance.toFixed(0);
      lastResultText.textContent = lastResult;
    }

    // ======== WORLD / PLAYER ========
    const player = {
      x: WIDTH / 2,
      y: HEIGHT - 80,
      size: 22,
      speed: 200,
      color: "#22d3ee"
    };

    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    let gameState = "walking"; // "walking" | "mini"

    // Stations: Slots, Hi-Lo, Roulette, Cashier, Dice, Double, Blackjack
    const stations = [
      {
        x: WIDTH / 2 - 260,
        y: HEIGHT / 2 - 150,
        w: 90,
        h: 42,
        type: "blackjack",
        label: "Blackjack"
      },
      {
        x: WIDTH / 2 - 180,
        y: HEIGHT / 2 - 40,
        w: 80,
        h: 40,
        type: "slots",
        label: "Slots"
      },
      {
        x: WIDTH / 2 + 100,
        y: HEIGHT / 2 - 40,
        w: 80,
        h: 40,
        type: "hilo",
        label: "Hi–Lo"
      },
      {
        x: WIDTH / 2 - 40,
        y: HEIGHT / 2 - 140,
        w: 80,
        h: 40,
        type: "roulette",
        label: "Roulette"
      },
      {
        x: WIDTH / 2 - 260,
        y: HEIGHT / 2 + 60,
        w: 80,
        h: 40,
        type: "dice",
        label: "Dice"
      },
      {
        x: WIDTH / 2 + 180,
        y: HEIGHT / 2 + 60,
        w: 80,
        h: 40,
        type: "double",
        label: "Double"
      },
      {
        x: WIDTH / 2 - 40,
        y: HEIGHT / 2 + 120,
        w: 80,
        h: 40,
        type: "reset",
        label: "Cashier"
      }
    ];

    function distance(x1, y1, x2, y2) {
      const dx = x1 - x2;
      const dy = y1 - y2;
      return Math.sqrt(dx * dx + dy * dy);
    }

    let nearStation = null;

    // ======== INPUT ========
    window.addEventListener("keydown", (e) => {
      if (gameState === "mini") {
        return;
      }

      if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
      if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = true;
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;

      if (e.code === "KeyE") {
        if (nearStation && gameState === "walking") {
          openStation(nearStation);
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
      if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    // ======== MINI-GAME OVERLAY HELPERS ========
    function showOverlay() {
      overlay.classList.add("active");
      gameState = "mini";
    }

    function hideOverlay() {
      overlay.classList.remove("active");
      gameState = "walking";
      lastResult = "Back to casino";
      updateHUD();
    }

    function clearOverlayButtons() {
      while (overlayButtons.firstChild) {
        overlayButtons.removeChild(overlayButtons.firstChild);
      }
    }

    function addOverlayButton(text, className, onClick) {
      const btn = document.createElement("button");
      btn.textContent = text;
      if (className) btn.classList.add(className);
      btn.addEventListener("click", onClick);
      overlayButtons.appendChild(btn);
    }

    // ======== STATION HANDLER ========
    function openStation(station) {
      if (station.type === "slots") {
        openSlotsGame();
      } else if (station.type === "hilo") {
        openHiLoGame();
      } else if (station.type === "roulette") {
        openRouletteGame();
      } else if (station.type === "reset") {
        openCashier();
      } else if (station.type === "dice") {
        openDiceGame();
      } else if (station.type === "double") {
        openDoubleGame();
      } else if (station.type === "blackjack") {
        openBlackjackGame();
      }
    }

    // ======== SLOTS GAME (with SPIN ANIMATION) ========
    function openSlotsGame() {
      overlayTitle.textContent = "Neon Slots";
      overlaySubtitle.textContent = "3 reels. 3 of a kind wins big. All fake chips.";

      overlayContent.innerHTML = "";

      const reelContainer = document.createElement("div");
      reelContainer.className = "slot-reels";

      const reel1 = document.createElement("div");
      const reel2 = document.createElement("div");
      const reel3 = document.createElement("div");
      reel1.className = reel2.className = reel3.className = "slot-reel";

      reel1.textContent = "❔";
      reel2.textContent = "❔";
      reel3.textContent = "❔";

      reelContainer.appendChild(reel1);
      reelContainer.appendChild(reel2);
      reelContainer.appendChild(reel3);
      overlayContent.appendChild(reelContainer);

      const msg = document.createElement("div");
      msg.className = "small-text";
      msg.textContent = "Choose a bet & press Spin. This is all fake money.";
      overlayContent.appendChild(msg);

      clearOverlayButtons();

      const betRow = document.createElement("div");
      betRow.className = "bet-buttons";
      const betAmounts = [10, 25, 50, 100];
      let currentBet = 25;

      betAmounts.forEach(amount => {
        const b = document.createElement("button");
        b.textContent = "$" + amount;
        b.addEventListener("click", () => {
          currentBet = amount;
          msg.textContent = "Bet set to $" + currentBet + ". Press Spin.";
        });
        betRow.appendChild(b);
      });

      overlayContent.appendChild(betRow);

      let spinning = false;
      const symbols = ["🍒","🍋","⭐","💎"];

      function randomSymbol() {
        return symbols[Math.floor(Math.random() * symbols.length)];
      }

      addOverlayButton("Spin", null, () => {
        if (spinning) return;

        if (balance < currentBet) {
          msg.textContent = "Not enough fake chips for that bet.";
          lastResult = "Insufficient chips on Slots";
          updateHUD();
          return;
        }

        balance -= currentBet;
        updateHUD();

        spinning = true;
        msg.textContent = "Spinning...";

        const spinDuration = 900; // ms
        const startTime = performance.now();

        function spinFrame(now) {
          const t = now - startTime;

          // flick random symbols
          reel1.textContent = randomSymbol();
          reel2.textContent = randomSymbol();
          reel3.textContent = randomSymbol();

          if (t < spinDuration) {
            requestAnimationFrame(spinFrame);
          } else {
            // Final result
            const r1 = randomSymbol();
            const r2 = randomSymbol();
            const r3 = randomSymbol();
            reel1.textContent = r1;
            reel2.textContent = r2;
            reel3.textContent = r3;

            let payout = 0;
            if (r1 === r2 && r2 === r3) {
              if (r1 === "🍒") payout = currentBet * 5;
              else if (r1 === "🍋") payout = currentBet * 8;
              else if (r1 === "⭐") payout = currentBet * 12;
              else if (r1 === "💎") payout = currentBet * 20;
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
              payout = currentBet * 2;
            }

            if (payout > 0) {
              balance += payout;
              msg.textContent = `You won $${payout} in fake chips!`;
              lastResult = `Slots +$${payout - currentBet}`;
            } else {
              msg.textContent = `No win. You lost $${currentBet}.`;
              lastResult = `Slots -$${currentBet}`;
            }
            updateHUD();
            spinning = false;
          }
        }

        requestAnimationFrame(spinFrame);
      });

      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      showOverlay();
    }

    // ======== HI–LO GAME (showing a CARD) ========
    function openHiLoGame() {
      overlayTitle.textContent = "Hi–Lo Table";
      overlaySubtitle.textContent = "Bet if the card (A–K) is high (8–K) or low (2–6). 7 is house win.";

      overlayContent.innerHTML = "";

      const status = document.createElement("div");
      status.textContent = "Place a bet and choose High or Low.";
      status.style.marginBottom = "6px";
      overlayContent.appendChild(status);

      const cardDisplay = document.createElement("div");
      cardDisplay.className = "card-display";
      cardDisplay.textContent = "🂠";
      overlayContent.appendChild(cardDisplay);

      const inputRow = document.createElement("div");
      inputRow.className = "input-row";

      const label = document.createElement("span");
      label.textContent = "Bet $";

      const betInput = document.createElement("input");
      betInput.type = "number";
      betInput.value = "50";
      betInput.min = "1";

      inputRow.appendChild(label);
      inputRow.appendChild(betInput);
      overlayContent.appendChild(inputRow);

      const small = document.createElement("div");
      small.className = "small-text";
      small.textContent = "Fake money only. Win: 2× bet. Lose: lose your bet.";
      overlayContent.appendChild(small);

      clearOverlayButtons();

      function valueToRank(v) {
        if (v === 1) return "A";
        if (v === 11) return "J";
        if (v === 12) return "Q";
        if (v === 13) return "K";
        return String(v);
      }

      function playHiLoRound(choice) {
        let bet = parseInt(betInput.value, 10);
        if (isNaN(bet) || bet <= 0) {
          status.textContent = "Enter a valid positive bet.";
          return;
        }
        if (balance < bet) {
          status.textContent = "Not enough fake chips for that bet.";
          lastResult = "Insufficient chips on Hi–Lo";
          updateHUD();
          return;
        }

        balance -= bet;

        const value = Math.floor(Math.random() * 13) + 1; // 1–13
        const suits = ["♠","♥","♦","♣"];
        const suit = suits[Math.floor(Math.random() * suits.length)];

        const rank = valueToRank(value);
        cardDisplay.textContent = rank + suit;
        if (suit === "♥" || suit === "♦") {
          cardDisplay.style.color = "#f97373";
        } else {
          cardDisplay.style.color = "#e5e7eb";
        }

        let outcome = "";
        let payout = 0;

        if (value === 7) {
          outcome = `Card is ${rank}${suit} (7). House wins. You lose $${bet}.`;
          lastResult = `Hi–Lo -$${bet}`;
        } else if (value >= 8 && choice === "high") {
          payout = bet * 2;
          balance += payout;
          outcome = `Card is ${rank}${suit} (High). You win $${payout}!`;
          lastResult = `Hi–Lo +$${payout - bet}`;
        } else if (value <= 6 && choice === "low") {
          payout = bet * 2;
          balance += payout;
          outcome = `Card is ${rank}${suit} (Low). You win $${payout}!`;
          lastResult = `Hi–Lo +$${payout - bet}`;
        } else {
          outcome = `Card is ${rank}${suit}. You lose $${bet}.`;
          lastResult = `Hi–Lo -$${bet}`;
        }

        status.textContent = outcome;
        updateHUD();
      }

      addOverlayButton("Bet High (8–K)", null, () => playHiLoRound("high"));
      addOverlayButton("Bet Low (2–6)", null, () => playHiLoRound("low"));
      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      showOverlay();
    }

    // ======== ROULETTE GAME (spinning wheel) ========
    function openRouletteGame() {
      overlayTitle.textContent = "Roulette Wheel";
      overlaySubtitle.textContent = "European style: 0–36. Red / Black pay 2×, single number pays 35×.";

      overlayContent.innerHTML = "";

      const wrapper = document.createElement("div");
      wrapper.className = "roulette-wrapper";

      const wheel = document.createElement("div");
      wheel.className = "roulette-wheel";

      const pointer = document.createElement("div");
      pointer.className = "roulette-pointer";
      wheel.appendChild(pointer);

      const wheelNumber = document.createElement("div");
      wheelNumber.className = "roulette-wheel-number";
      wheelNumber.textContent = "–";
      wheel.appendChild(wheelNumber);

      const numberText = document.createElement("div");
      numberText.className = "roulette-number-text";
      numberText.textContent = "Spin to see a result.";

      wrapper.appendChild(wheel);
      wrapper.appendChild(numberText);
      overlayContent.appendChild(wrapper);

      const inputRow = document.createElement("div");
      inputRow.className = "input-row";

      const label = document.createElement("span");
      label.textContent = "Bet $";

      const betInput = document.createElement("input");
      betInput.type = "number";
      betInput.value = "50";
      betInput.min = "1";

      inputRow.appendChild(label);
      inputRow.appendChild(betInput);
      overlayContent.appendChild(inputRow);

      const numRow = document.createElement("div");
      numRow.className = "input-row";

      const numLabel = document.createElement("span");
      numLabel.textContent = "Number (0–36):";

      const numberInput = document.createElement("input");
      numberInput.type = "number";
      numberInput.className = "big";
      numberInput.value = "17";

      numRow.appendChild(numLabel);
      numRow.appendChild(numberInput);
      overlayContent.appendChild(numRow);

      const small = document.createElement("div");
      small.className = "small-text";
      small.textContent = "This is pretend money. Colors use a simple pattern, not an exact real wheel.";
      overlayContent.appendChild(small);

      clearOverlayButtons();

      let spinning = false;

      function getRouletteColor(n) {
        if (n === 0) return "green";
        return (n % 2 === 0) ? "black" : "red";
      }

      function spinRoulette(betType, betValue) {
        if (spinning) return;

        let bet = parseInt(betInput.value, 10);
        if (isNaN(bet) || bet <= 0) {
          numberText.textContent = "Enter a valid positive bet.";
          return;
        }
        if (balance < bet) {
          numberText.textContent = "Not enough fake chips for that bet.";
          lastResult = "Insufficient chips on Roulette";
          updateHUD();
          return;
        }

        balance -= bet;
        updateHUD();

        const result = Math.floor(Math.random() * 37); // 0–36
        const color = getRouletteColor(result);

        spinning = true;
        numberText.textContent = "Spinning...";
        wheelNumber.textContent = "";

        const spinDuration = 1200;
        const startTime = performance.now();
        const finalAngle = 360 * 4 + (result / 37) * 360;

        function spinFrame(now) {
          const t = (now - startTime) / spinDuration;
          if (t < 1) {
            const eased = 1 - Math.pow(1 - t, 3); // ease-out
            const angle = eased * finalAngle;
            wheel.style.transform = `rotate(${angle}deg)`;
            requestAnimationFrame(spinFrame);
          } else {
            wheel.style.transform = `rotate(${finalAngle}deg)`;
            wheelNumber.textContent = result;
            if (color === "red") {
              wheelNumber.style.color = "#f97373";
            } else if (color === "black") {
              wheelNumber.style.color = "#e5e7eb";
            } else {
              wheelNumber.style.color = "#22c55e";
            }

            let payout = 0;
            let msg = "";

            if (betType === "color") {
              if (color === betValue && color !== "green") {
                payout = bet * 2;
                balance += payout;
                msg = `Result: ${result} (${color}). You won $${payout}!`;
                lastResult = `Roulette ${betValue} +$${payout - bet}`;
              } else {
                msg = `Result: ${result} (${color}). You lost $${bet}.`;
                lastResult = `Roulette ${betValue} -$${bet}`;
              }
            } else if (betType === "number") {
              const chosen = parseInt(betValue, 10);
              if (isNaN(chosen) || chosen < 0 || chosen > 36) {
                msg = "Enter a valid number between 0 and 36.";
                // refund bet if invalid
                balance += bet;
                lastResult = "Roulette invalid number";
              } else if (result === chosen) {
                payout = bet * 35;
                balance += payout;
                msg = `Jackpot! ${result} hit. You won $${payout}!`;
                lastResult = `Roulette #${chosen} +$${payout - bet}`;
              } else {
                msg = `Result: ${result} (${color}). You lost $${bet}.`;
                lastResult = `Roulette #${chosen} -$${bet}`;
              }
            }

            numberText.textContent = msg;
            updateHUD();
            spinning = false;
          }
        }

        requestAnimationFrame(spinFrame);
      }

      addOverlayButton("Bet Red", null, () => spinRoulette("color","red"));
      addOverlayButton("Bet Black", null, () => spinRoulette("color","black"));
      addOverlayButton("Bet Number", null, () => spinRoulette("number", numberInput.value));
      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      showOverlay();
    }

    // ======== BLACKJACK LITE ========
    function openBlackjackGame() {
      overlayTitle.textContent = "Blackjack (Lite)";
      overlaySubtitle.textContent = "Simple rules: 21 beats dealer, dealer hits to 17. Both hands visible for clarity.";

      overlayContent.innerHTML = "";

      const status = document.createElement("div");
      status.textContent = "Set your bet and press Deal.";
      status.style.marginBottom = "6px";
      overlayContent.appendChild(status);

      const inputRow = document.createElement("div");
      inputRow.className = "input-row";

      label.textContent = "Bet $";

      const betInput = document.createElement("input");
      betInput.type = "number";
      betInput.value = "50";
      betInput.min = "1";

      inputRow.appendChild(label);
      inputRow.appendChild(betInput);
      overlayContent.appendChild(inputRow);

      const playerHandRow = document.createElement("div");
      playerHandRow.className = "hand-row";
      const playerLabel = document.createElement("div");
      playerLabel.className = "hand-label";
      playerLabel.textContent = "Your Hand:";
      const playerCardsDiv = document.createElement("div");
      playerCardsDiv.className = "cards-row";
      playerHandRow.appendChild(playerLabel);
      playerHandRow.appendChild(playerCardsDiv);

      const dealerHandRow = document.createElement("div");
      dealerHandRow.className = "hand-row";
      const dealerLabel = document.createElement("div");
      dealerLabel.className = "hand-label";
      dealerLabel.textContent = "Dealer:";
      const dealerCardsDiv = document.createElement("div");
      dealerCardsDiv.className = "cards-row";
      dealerHandRow.appendChild(dealerLabel);
      dealerHandRow.appendChild(dealerCardsDiv);

      overlayContent.appendChild(playerHandRow);
      overlayContent.appendChild(dealerHandRow);

      const small = document.createElement("div");
      small.className = "small-text";
      small.textContent = "This is a simplified version. No splits / doubles; just Deal, Hit, Stand. Fake money only.";
      overlayContent.appendChild(small);

      clearOverlayButtons();

      let playerHand = [];
      let dealerHand = [];
      let roundActive = false;
      let currentBet = 0;

      function randomCard() {
        const value = Math.floor(Math.random() * 13) + 1; // 1–13
        const suits = ["♠","♥","♦","♣"];
        const suit = suits[Math.floor(Math.random() * suits.length)];
        return { value, suit };
      }

      function cardRank(card) {
        const v = card.value;
        if (v === 1) return "A";
        if (v === 11) return "J";
        if (v === 12) return "Q";
        if (v === 13) return "K";
        return String(v);
      }

      function handTotal(hand) {
        let total = 0;
        let aces = 0;
        for (const c of hand) {
          let v = c.value;
          if (v > 10) v = 10;
          if (v === 1) {
            v = 11;
            aces++;
          }
          total += v;
        }
        while (total > 21 && aces > 0) {
          total -= 10;
          aces--;
        }
        return total;
      }

      function renderHand(container, hand) {
        container.innerHTML = "";
        hand.forEach(card => {
          const d = document.createElement("div");
          d.className = "card-small";
          const rank = cardRank(card);
          d.textContent = rank + card.suit;
          if (card.suit === "♥" || card.suit === "♦") {
            d.style.color = "#f97373";
          } else {
            d.style.color = "#e5e7eb";
          }
          container.appendChild(d);
        });
        const total = handTotal(hand);
        const totalDiv = document.createElement("div");
        totalDiv.className = "small-text";
        totalDiv.textContent = `Total: ${total}`;
        container.appendChild(totalDiv);
      }

      function startRound() {
        if (roundActive) {
          status.textContent = "Finish the current round first (Hit or Stand).";
          return;
        }

        let bet = parseInt(betInput.value, 10);
        if (isNaN(bet) || bet <= 0) {
          status.textContent = "Enter a valid positive bet.";
          return;
        }
        if (balance < bet) {
          status.textContent = "Not enough fake chips for that bet.";
          lastResult = "Insufficient chips on Blackjack";
          updateHUD();
          return;
        }

        balance -= bet;
        updateHUD();

        currentBet = bet;
        roundActive = true;
        playerHand = [randomCard(), randomCard()];
        dealerHand = [randomCard(), randomCard()];

        renderHand(playerCardsDiv, playerHand);
        renderHand(dealerCardsDiv, dealerHand);

        const pTotal = handTotal(playerHand);
        const dTotal = handTotal(dealerHand);

        if (pTotal === 21 && dTotal !== 21) {
          const payout = Math.round(currentBet * 2.5);
          balance += payout;
          status.textContent = `Blackjack! You win $${payout}.`;
          lastResult = `Blackjack +$${payout - currentBet}`;
          updateHUD();
          roundActive = false;
        } else {
          status.textContent = "You are dealt two cards. Hit or Stand.";
        }
      }

      function playerHit() {
        if (!roundActive) {
          status.textContent = "Press Deal to start a hand.";
          return;
        }
        playerHand.push(randomCard());
        renderHand(playerCardsDiv, playerHand);

        const total = handTotal(playerHand);
        if (total > 21) {
          status.textContent = `You bust with ${total}. You lose $${currentBet}.`;
          lastResult = `Blackjack -$${currentBet}`;
          roundActive = false;
          updateHUD();
        } else {
          status.textContent = `You have ${total}. Hit or Stand.`;
        }
      }

      function playerStand() {
        if (!roundActive) {
          status.textContent = "Press Deal to start a hand.";
          return;
        }

        let dTotal = handTotal(dealerHand);
        while (dTotal < 17) {
          dealerHand.push(randomCard());
          dTotal = handTotal(dealerHand);
        }
        renderHand(dealerCardsDiv, dealerHand);

        const pTotal = handTotal(playerHand);

        let msg = "";
        if (dTotal > 21) {
          const payout = currentBet * 2;
          balance += payout;
          msg = `Dealer busts with ${dTotal}. You win $${payout}.`;
          lastResult = `Blackjack +$${payout - currentBet}`;
        } else if (pTotal > dTotal) {
          const payout = currentBet * 2;
          balance += payout;
          msg = `You ${pTotal} vs dealer ${dTotal}. You win $${payout}.`;
          lastResult = `Blackjack +$${payout - currentBet}`;
        } else if (pTotal === dTotal) {
          balance += currentBet;
          msg = `Push ${pTotal}–${dTotal}. You get your $${currentBet} back.`;
          lastResult = "Blackjack push";
        } else {
          msg = `Dealer wins ${dTotal} vs ${pTotal}. You lose $${currentBet}.`;
          lastResult = `Blackjack -$${currentBet}`;
        }

        status.textContent = msg;
        updateHUD();
        roundActive = false;
      }

      addOverlayButton("Deal / New Hand", null, startRound);
      addOverlayButton("Hit", null, playerHit);
      addOverlayButton("Stand", null, playerStand);
      addOverlayButton("Back to Floor", "secondary", hideOverlay);

      showOverlay();
    }

    // ======== UPDATE / DRAW ========
    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (gameState === "walking") {
        update(dt);
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      let dx = 0;
      let dy = 0;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;

      const length = Math.sqrt(dx*dx + dy*dy);
      if (length > 0) {
        dx /= length;
        dy /= length;
      }

      player.x += dx * player.speed * dt;
      player.y += dy * player.speed * dt;

      // Boundaries of casino floor
      const margin = 40;
      if (player.x < margin) player.x = margin;
      if (player.x > WIDTH - margin) player.x = WIDTH - margin;
      if (player.y < margin + 20) player.y = margin + 20;
      if (player.y > HEIGHT - margin) player.y = HEIGHT - margin;

      // Check proximity to stations
      nearStation = null;
      let minDist = 70;
      stations.forEach(st => {
        const cx = st.x + st.w / 2;
        const cy = st.y + st.h / 2;
        const d = distance(player.x, player.y, cx, cy);
        if (d < minDist) {
          minDist = d;
          nearStation = st;
        }
      });

      if (nearStation) {
        if (nearStation.type === "reset") {
          hintEl.textContent = `Press E to talk to the ${nearStation.label} (reset fake chips).`;
        } else {
          hintEl.textContent = `Press E to play ${nearStation.label}.`;
        }
      } else {
        hintEl.textContent = "Use WASD / Arrow keys to walk. Find a table and press E to play.";
      }
    }

    function render() {
      ctx.clearRect(0,0,WIDTH,HEIGHT);

      // Fancy carpet background
      const grad = ctx.createLinearGradient(0,0,WIDTH,HEIGHT);
      grad.addColorStop(0,"#020617");
      grad.addColorStop(1,"#020617");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,WIDTH,HEIGHT);

      // Diamond patterned carpet
      const size = 40;
      for (let y = 0; y < HEIGHT; y += size) {
        for (let x = 0; x < WIDTH; x += size) {
          ctx.save();
          ctx.translate(x + size/2, y + size/2);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = ( (x/size + y/size) % 2 === 0 )
            ? "rgba(30,64,175,0.18)"
            : "rgba(180,83,9,0.18)";
          ctx.fillRect(-size/3, -size/3, size/1.5, size/1.5);
          ctx.restore();
        }
      }

      // Neon paths
      ctx.fillStyle = "rgba(6,182,212,0.2)";
      ctx.fillRect(26,0,10,HEIGHT);
      ctx.fillRect(WIDTH-36,0,10,HEIGHT);

      ctx.fillStyle = "rgba(236,72,153,0.2)";
      ctx.fillRect(0,30,WIDTH,6);
      ctx.fillRect(0,HEIGHT-36,WIDTH,6);

      // Walls / ceiling line
      ctx.fillStyle = "#020617";
      ctx.fillRect(0,0,WIDTH,26);
      ctx.fillRect(0,HEIGHT-26,WIDTH,26);
      ctx.fillRect(0,0,26,HEIGHT);
      ctx.fillRect(WIDTH-26,0,26,HEIGHT);

      // Ceiling lights
      for (let i = 0; i < 5; i++) {
        const lx = 80 + i * 160;
        ctx.fillStyle = "rgba(248,250,252,0.08)";
        ctx.beginPath();
        ctx.arc(lx, 26, 22, 0, Math.PI*2);
        ctx.fill();
      }

      // Stations with custom icons
      stations.forEach(st => {
        let color = "#1f2937";
        if (st.type === "slots") color = "#4c1d95";
        if (st.type === "hilo") color = "#075985";
        if (st.type === "roulette") color = "#b45309";
        if (st.type === "reset") color = "#14532d";
        if (st.type === "dice") color = "#7c2d12";
        if (st.type === "double") color = "#0369a1";
        if (st.type === "blackjack") color = "#166534";

        // glow base
        ctx.fillStyle = "rgba(15,23,42,0.7)";
        ctx.fillRect(st.x - 6, st.y - 6, st.w + 12, st.h + 12);

        // main table/machine
        ctx.fillStyle = color;
        ctx.fillRect(st.x, st.y, st.w, st.h);

        ctx.strokeStyle = "rgba(248,250,252,0.7)";
        ctx.lineWidth = 2;
        ctx.strokeRect(st.x, st.y, st.w, st.h);

        // Label
        ctx.fillStyle = "rgba(248,250,252,0.9)";
        ctx.font = "12px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(st.label, st.x + st.w / 2, st.y - 6);

        // Icon inside the table
        const cx = st.x + st.w / 2;
        const cy = st.y + st.h / 2;
        ctx.save();
        ctx.translate(cx, cy);
        if (st.type === "slots") {
          // three slot windows
          ctx.fillStyle = "#020617";
          const w = st.w * 0.2;
          const h = st.h * 0.5;
          ctx.fillRect(-w - 4, -h/2, w, h);
          ctx.fillRect(-w/2, -h/2, w, h);
          ctx.fillRect(4, -h/2, w, h);
        } else if (st.type === "hilo") {
          // two card shapes
          ctx.fillStyle = "#020617";
          ctx.fillRect(-10, -8, 16, 20);
          ctx.fillRect(-2, -10, 16, 20);
        } else if (st.type === "roulette") {
          ctx.beginPath();
          ctx.fillStyle = "#020617";
          ctx.arc(0,0,10,0,Math.PI*2);
          ctx.fill();
        } else if (st.type === "reset") {
          ctx.fillStyle = "#facc15";
          ctx.font = "14px system-ui";
          ctx.fillText("$",0,5);
        } else if (st.type === "dice") {
          ctx.fillStyle = "#020617";
          ctx.fillRect(-10, -10, 16, 16);
          ctx.fillRect(2, -2, 16, 16);
        } else if (st.type === "double") {
          ctx.strokeStyle = "#e5e7eb";
          ctx.beginPath();
          ctx.moveTo(-8,4);
          ctx.lineTo(0,-4);
          ctx.lineTo(8,4);
          ctx.stroke();
        } else if (st.type === "blackjack") {
          ctx.fillStyle = "#020617";
          ctx.fillRect(-14, -10, 18, 22);
          ctx.fillRect(-4, -12, 18, 22);
        }
        ctx.restore();
      });

      // Player shadow
      ctx.fillStyle = "rgba(15,23,42,0.7)";
      ctx.beginPath();
      ctx.ellipse(player.x, player.y + player.size*0.4, player.size*0.7, player.size*0.35, 0, 0, Math.PI*2);
      ctx.fill();

      // Player body (torso)
      const bodyW = player.size * 0.7;
      const bodyH = player.size * 1.1;
      const bodyX = player.x - bodyW/2;
      const bodyY = player.y - bodyH/2 + 4;
      ctx.fillStyle = player.color;
      ctx.fillRect(bodyX, bodyY, bodyW, bodyH);

      // Body outline
      ctx.strokeStyle = "rgba(15,23,42,0.95)";
      ctx.lineWidth = 2;
      ctx.strokeRect(bodyX, bodyY, bodyW, bodyH);

      // Player head
      const headR = player.size * 0.45;
      const headX = player.x;
      const headY = bodyY - headR + 4;
      ctx.fillStyle = "#e5e7eb";
      ctx.beginPath();
      ctx.arc(headX, headY, headR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(15,23,42,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(headX, headY, headR, 0, Math.PI * 2);
      ctx.stroke();

      // Simple hair band
      ctx.strokeStyle = "#020617";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(headX, headY - 2, headR * 0.9, Math.PI*0.2, Math.PI*0.8);
      ctx.stroke();

      // Eyes
      ctx.fillStyle = "#020617";
      const eyeOffset = headR * 0.35;
      const eyeY = headY - headR * 0.15;
      ctx.beginPath();
      ctx.arc(headX - eyeOffset, eyeY, 2.2, 0, Math.PI*2);
      ctx.arc(headX + eyeOffset, eyeY, 2.2, 0, Math.PI*2);
      ctx.fill();

      // Simple mouth
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(headX, headY + headR*0.2, headR*0.35, 0, Math.PI);
      ctx.stroke();
    }

    // ======== START ========
    updateHUD();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
